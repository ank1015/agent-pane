name: Execution cross-platform

on:
  pull_request:
    paths:
      - "execution/**"
      - ".github/workflows/execution-cross-platform.yml"
  push:
    paths:
      - "execution/**"
      - ".github/workflows/execution-cross-platform.yml"

permissions:
  contents: read

jobs:
  registered-host:
    name: Registered Host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    defaults:
      run:
        working-directory: execution

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy,rustfmt

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Start PostgreSQL (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser "$USER"
          for attempt in {1..30}; do
            pg_isready && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          createdb execution_gateway_daemon_e2e
          echo "EXECUTION_GATEWAY_TEST_DATABASE_URL=postgresql:///execution_gateway_daemon_e2e" >> "$GITHUB_ENV"

      - name: Start PostgreSQL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install postgresql@17
          brew services start postgresql@17
          postgres_bin="$(brew --prefix postgresql@17)/bin"
          for attempt in {1..30}; do
            "$postgres_bin/pg_isready" && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          "$postgres_bin/createdb" execution_gateway_daemon_e2e
          echo "EXECUTION_GATEWAY_TEST_DATABASE_URL=postgresql:///execution_gateway_daemon_e2e" >> "$GITHUB_ENV"

      - name: Start PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
          $env:PGPASSWORD = "root"
          $pgReady = Join-Path $env:PGBIN "pg_isready.exe"
          $ready = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            & $pgReady -h localhost -U postgres
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw "PostgreSQL did not become ready" }
          & (Join-Path $env:PGBIN "createdb.exe") -h localhost -U postgres execution_gateway_daemon_e2e
          "EXECUTION_GATEWAY_TEST_DATABASE_URL=postgresql://postgres:root@localhost:5432/execution_gateway_daemon_e2e" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Lint registered-host components
        run: >-
          cargo clippy --all-targets
          -p execution-core
          -p execution-wire
          -p execution-api
          -p execution-conformance
          -p execution-client
          -p execution-supervisor-core
          -p execution-e2b
          -p execution-gateway
          -p execution-host-daemon
          -- -D warnings

      - name: Test registered-host components
        run: >-
          cargo test
          -p execution-core
          -p execution-wire
          -p execution-api
          -p execution-conformance
          -p execution-client
          -p execution-supervisor-core
          -p execution-e2b
          -p execution-gateway
          -p execution-host-daemon

      - name: Run production daemon end-to-end test
        run: >-
          cargo test -p execution-host-daemon
          --test registered_host_e2e
          -- --ignored --nocapture
