[package]
name = "codex-code-mode-runtime"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
deno_core_icudata.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
v8.workspace = true

# This crate intentionally does not inherit the workspace's `unsafe_code =
# "forbid"` lint. rusty_v8's module-resolution callback macro requires one
# narrowly scoped unsafe callback boundary; JavaScript itself remains
# capability-limited and cannot access the host without a delegate call.
