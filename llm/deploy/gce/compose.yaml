services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=128MB
    environment:
      POSTGRES_DB: llm_gateway
      POSTGRES_USER: llm_gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_gateway -d llm_gateway"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: ${LLM_GATEWAY_IMAGE:?LLM_GATEWAY_IMAGE is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LLM_GATEWAY_BIND_ADDRESS: 0.0.0.0:8791
      LLM_GATEWAY_DATABASE_URL: postgresql://llm_gateway:${POSTGRES_PASSWORD}@postgres:5432/llm_gateway
      LLM_GATEWAY_DATABASE_MAX_CONNECTIONS: 5
      LLM_GATEWAY_DATABASE_MIN_CONNECTIONS: 1
      LLM_GATEWAY_DATABASE_ACQUIRE_TIMEOUT_SECONDS: 5
      LLM_GATEWAY_VAULT_KEY: ${LLM_GATEWAY_VAULT_KEY:?LLM_GATEWAY_VAULT_KEY is required}
      LLM_GATEWAY_API_TOKEN: ${LLM_GATEWAY_API_TOKEN:?LLM_GATEWAY_API_TOKEN is required}
      LLM_GATEWAY_ADMIN_TOKEN: ${LLM_GATEWAY_ADMIN_TOKEN:?LLM_GATEWAY_ADMIN_TOKEN is required}
      LLM_GATEWAY_MAX_CONCURRENT_REQUESTS: 32
      LLM_GATEWAY_MAX_QUEUED_REQUESTS: 64
      LLM_GATEWAY_QUEUE_TIMEOUT_SECONDS: 120
      LLM_GATEWAY_MAX_AUTH_FAILURES_PER_MINUTE: 30
      LLM_GATEWAY_MAX_REQUEST_BYTES: 67108864
      LLM_GATEWAY_REQUEST_TIMEOUT_SECONDS: 2100
      RUST_LOG: llm_gateway=info
    expose:
      - "8791"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      GATEWAY_PUBLIC_HOST: ${GATEWAY_PUBLIC_HOST:?GATEWAY_PUBLIC_HOST is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
