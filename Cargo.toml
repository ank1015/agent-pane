[workspace]
members = ["apps/*", "packages/*"]
exclude = ["apps/dashboard"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
agent-contracts = { path = "packages/agent-contracts", version = "0.1.0" }
agent-harness-sdk = { path = "packages/agent-harness-sdk", version = "0.1.0" }
async-nats = { version = "0.46", default-features = false, features = ["jetstream", "ring", "server_2_10", "server_2_11", "server_2_12"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1.0"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
credential-vault = { path = "packages/credential-vault", version = "0.1.0" }
dotenvy = "0.15"
deno_core_icudata = "0.77.0"
execution-contracts = { path = "packages/execution-contracts", version = "0.1.0" }
execution-gateway-client = { path = "packages/execution-gateway-client", version = "0.1.0" }
execution-local = { path = "packages/execution-local", version = "0.1.0" }
execution-protocol = { path = "packages/execution-protocol", version = "0.1.0" }
execution-runtime = { path = "packages/execution-runtime", version = "0.1.0" }
futures-core = "0.3"
futures = { version = "0.3", default-features = false }
futures-util = "0.3"
globset = "0.4"
httpdate = "1.0"
ignore = "0.4"
image = { version = "0.25.9", default-features = false }
jsonschema = { version = "0.50", default-features = false }
llm-contracts = { path = "packages/llm-contracts", version = "0.1.0" }
tool-pi-read = { path = "packages/tool-pi-read", version = "0.1.0" }
tool-pi-edit = { path = "packages/tool-pi-edit", version = "0.1.0" }
tool-pi-bash = { path = "packages/tool-pi-bash", version = "0.1.0" }
tool-pi-write = { path = "packages/tool-pi-write", version = "0.1.0" }
tool-codex-view-image = { path = "packages/tool-codex-view-image", version = "0.1.0" }
tool-codex-apply-patch = { path = "packages/tool-codex-apply-patch", version = "0.1.0" }
tool-codex-unified-exec = { path = "packages/tool-codex-unified-exec", version = "0.1.0" }
tool-codex-code-mode = { path = "packages/tool-codex-code-mode", version = "0.1.0" }
tool-codex-web-search = { path = "packages/tool-codex-web-search", version = "0.1.0" }
tool-firecrawl-search = { path = "packages/tool-firecrawl-search", version = "0.1.0" }
tool-firecrawl-scrape = { path = "packages/tool-firecrawl-scrape", version = "0.1.0" }
codex-code-mode-runtime = { path = "packages/codex-code-mode-runtime", version = "0.1.0" }
provider-anthropic = { path = "packages/provider-anthropic", version = "0.1.0" }
provider-chatgpt = { path = "packages/provider-chatgpt", version = "0.1.0" }
provider-deepseek = { path = "packages/provider-deepseek", version = "0.1.0" }
provider-fireworks = { path = "packages/provider-fireworks", version = "0.1.0" }
provider-openai = { path = "packages/provider-openai", version = "0.1.0" }
provider-openrouter = { path = "packages/provider-openrouter", version = "0.1.0" }
portable-pty = "0.9"
rand = "0.8"
regex = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7.4"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "derive", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.0", features = ["serde", "v5", "v7"] }
v8 = "=150.4.0"
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
