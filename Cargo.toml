[workspace]
members = ["packages/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
httpdate = "1.0"
llm-contracts = { path = "packages/llm-contracts", version = "0.1.0" }
provider-anthropic = { path = "packages/provider-anthropic", version = "0.1.0" }
provider-deepseek = { path = "packages/provider-deepseek", version = "0.1.0" }
provider-openai = { path = "packages/provider-openai", version = "0.1.0" }
provider-openrouter = { path = "packages/provider-openrouter", version = "0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt-multi-thread"] }
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
