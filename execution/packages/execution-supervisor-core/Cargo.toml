[package]
name = "execution-supervisor-core"
description = "Local filesystem and durable process implementation for execution hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
execution-core = { path = "../execution-core" }
portable-pty.workspace = true
which = "8"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
mio = { version = "1", features = ["os-poll", "os-ext"] }
nix = { version = "0.28", features = ["process", "signal", "user"] }

[dev-dependencies]
execution-conformance = { path = "../execution-conformance" }
tempfile = "3.0"

[lints]
workspace = true
